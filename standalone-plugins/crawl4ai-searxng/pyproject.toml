[project]
name = "crawl4ai-searxng"
version = "1.0.0"
description = "Local-first web backends for Hermes: crawl4ai browser extraction and on-demand SearXNG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ronail" }]
keywords = ["hermes", "web", "crawl4ai", "searxng", "extraction", "local"]

# crawl4ai ships the Playwright-driven browser stack. `crawl4ai install` still
# has to provision the Chromium binary once after install (see README) — the
# dependency below only makes the Python package importable.
dependencies = [
    "crawl4ai>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/ronail/hermes-agent/tree/main/standalone-plugins/crawl4ai-searxng"

# Hermes loads this package through the `hermes_agent.plugins` entry point.
# The module exposes a top-level `register(ctx)`.
[project.entry-points."hermes_agent.plugins"]
crawl4ai-searxng = "crawl4ai_searxng"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The plugin package is `crawl4ai_searxng/`; plugin.yaml sits beside it
# and is read from the installed package data.
packages = ["crawl4ai_searxng"]

[tool.setuptools.package-data]
crawl4ai_searxng = ["plugin.yaml"]
